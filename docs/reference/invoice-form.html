<title>3개국어 세금계산서 양식</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#eef2f0; --paper:#ffffff; --ink:#15211d; --ink-2:#4b5d57; --ink-3:#7d8c87;
  --rule:#b9c9c2; --rule-2:#dbe5e1; --band:#e3efe8; --accent:#0d6e53; --accent-soft:#d5ebe2;
  --warn:#9a5b00; --warn-soft:#fbecd2; --ok:#1c7a43; --ok-soft:#dcefe2;
  --sans:"IBM Plex Sans KR","IBM Plex Sans Thai","IBM Plex Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0e1412; --paper:#161e1b; --ink:#e3ebe8; --ink-2:#a8b7b2; --ink-3:#77877f;
    --rule:#34443e; --rule-2:#26332e; --band:#1c2a25; --accent:#3cbf93; --accent-soft:#173a2f;
    --warn:#f0b454; --warn-soft:#3a2a10; --ok:#5ccf8a; --ok-soft:#173424;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0e1412; --paper:#161e1b; --ink:#e3ebe8; --ink-2:#a8b7b2; --ink-3:#77877f;
  --rule:#34443e; --rule-2:#26332e; --band:#1c2a25; --accent:#3cbf93; --accent-soft:#173a2f;
  --warn:#f0b454; --warn-soft:#3a2a10; --ok:#5ccf8a; --ok-soft:#173424;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;padding-inline:16px;padding-block:20px 48px}
[lang="th"]{font-family:"IBM Plex Sans Thai",var(--sans);line-height:1.7}
[lang="ja"]{font-family:"IBM Plex Sans JP",var(--sans)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mono{font-family:var(--mono)}
h1,h2{margin:0;text-wrap:balance;line-height:1.3}
.shell{max-width:980px;margin:0 auto;display:grid;gap:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.bar h1{font-size:18px;font-weight:600}
.bar p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--paper);gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* paper */
.paper{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:24px;display:grid;gap:12px;box-shadow:0 1px 0 var(--rule-2)}
.top{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.seller .name{font-size:17px;font-weight:600}
.seller .addr{color:var(--ink-2);font-size:12.5px}
.docbox{border:1px solid var(--rule);display:grid}
.docbox .val.mono{white-space:nowrap}
.docbox .serial{font-family:var(--mono);color:var(--accent);font-size:20px;font-weight:600;text-align:right;padding:6px 10px;border-bottom:1px solid var(--rule)}
.title{text-align:center;display:grid;gap:2px;padding-block:4px}
.title .orig{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:600}
.title .main{font-size:18px;font-weight:600}
.boxes{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px}
.box{border:1px solid var(--rule);padding:10px 12px;display:grid;gap:6px;min-width:0}
.kv{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:4px 12px;align-items:baseline}
.kv + .kv{border-top:1px dashed var(--rule-2);padding-top:6px}
.lab{font-size:11.5px;color:var(--ink-3);display:grid;line-height:1.35}
.val{min-width:0;overflow-wrap:anywhere}
.val .l{display:block}
.val .l + .l{color:var(--ink-2);font-size:13px}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--band);color:var(--ink-2);margin-left:6px;vertical-align:1px}
.unsure{text-decoration:underline dotted var(--warn);text-underline-offset:3px}
.tag-unsure{background:var(--warn-soft);color:var(--warn)}

/* items */
.tablewrap{overflow-x:auto;border:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{background:var(--band);font-weight:600;font-size:12px;text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:bottom}
th .lab{color:var(--ink-2)}
td{padding:9px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.filler{height:70px}

/* bottom */
.bottom{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:10px;align-items:start}
.ladder{border:1px solid var(--rule);display:grid}
.step{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;padding:6px 12px;border-bottom:1px solid var(--rule-2);align-items:center}
.step.sub .lab{padding-left:10px}
.step.net{background:var(--band);border-bottom:0;padding-block:10px}
.step.net .num{font-size:17px;font-weight:600;color:var(--accent)}
.words{background:var(--band);border:1px solid var(--rule);padding:10px 12px;text-align:center;font-weight:600}
.words .l + .l{font-weight:400;color:var(--ink-2);font-size:13px}
.terms{font-size:12.5px;color:var(--ink-2)}
.terms ul{margin:4px 0 0;padding-left:18px;display:grid;gap:3px}
.signs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sign{border:1px solid var(--rule);padding:10px 12px;display:grid;gap:6px}
.sign .state{font-size:13px}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}

/* checks */
.checks{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:16px 20px;display:grid;gap:10px}
.checks h2{font-size:15px;font-weight:600}
.clist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 20px;margin:0;padding:0;list-style:none}
.clist li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;font-size:13.5px}
.mark{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;margin-top:1px}
.mark.ok{background:var(--ok-soft);color:var(--ok)}
.mark.warn{background:var(--warn-soft);color:var(--warn)}
.clist small{display:block;color:var(--ink-3);font-size:12px}

@media (max-width:760px){
  .paper{padding:14px}
  .top,.boxes,.bottom{grid-template-columns:1fr}
  .signs{grid-template-columns:1fr}
  .clist{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
}
</style>

/* ---------- helpers ---------- */
let mode = "all"; // all | th | en | ja
const IDX = {th:0,en:1,ja:2}, LANG=["th","en","ja"];
function h(tag, attrs, ...kids){
  const el=document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){ if(v==null||v===false) continue;
    if(k==="class") el.className=v; else if(k.startsWith("on")) el.addEventListener(k.slice(2),v); else el.setAttribute(k,v===true?"":v); }
  for(const c of kids.flat()){ if(c==null||c===false) continue; el.append(c instanceof Node?c:String(c)); }
  return el;
}
const pick = arr => mode==="all" ? LANG.map((lg,i)=>[lg,arr[i]]) : [[mode,arr[IDX[mode]]]];
const lab = key => h("span",{class:"lab"},...pick(LB[key]).map(([lg,t])=>h("span",{lang:lg},t)));
const val = (arr,cls) => h("span",{class:"val"+(cls?" "+cls:"")},...pick(arr).map(([lg,t])=>h("span",{class:"l",lang:lg},t)));
const kv = (key, value) => h("div",{class:"kv"},lab(key), value instanceof Node ? value : h("span",{class:"val mono"},value||"—"));
const fmt = n => n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const dmy = iso => { const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
const unsureTag = () => h("span",{class:"chip tag-unsure"},pick(LB.unsure).map(x=>x[1]).join(" · "));

/* ---------- Thai checks ---------- */
function taxIdOk(id){ const d=id.replace(/\D/g,""); if(d.length!==13) return false; let s=0; for(let i=0;i<12;i++) s+=+d[i]*(13-i); return (11-s%11)%10===+d[12]; }
function thaiInt(n){
  const D=["","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า"], P=["","สิบ","ร้อย","พัน","หมื่น","แสน"];
  let s=String(n).replace(/^0+/,""); if(!s) return "";
  const groups=[]; while(s.length>6){ groups.unshift(s.slice(-6)); s=s.slice(0,-6); } groups.unshift(s);
  let out="";
  groups.forEach((g,gi)=>{ const gs=g.replace(/^0+/,""); const higher=out!=="";
    for(let i=0;i<gs.length;i++){ const x=+gs[i], pos=gs.length-1-i; if(!x) continue;
      if(pos===1) out+= x===1?"สิบ":x===2?"ยี่สิบ":D[x]+"สิบ";
      else if(pos===0 && x===1 && (gs.length>1||higher)) out+="เอ็ด";
      else out+=D[x]+P[pos]; }
    if(gi<groups.length-1) out+="ล้าน"; });
  return out;
}
function bahtText(v){ const st=Math.round(v*100), b=Math.floor(st/100), s=st%100;
  if(!b&&!s) return "ศูนย์บาทถ้วน"; return (b?thaiInt(b)+"บาท":"")+(s?thaiInt(s)+"สตางค์":"ถ้วน"); }

      h("div",{style:"padding:8px 10px;display:grid;gap:6px"},
        kv("docNo",D.docNo), kv("date",dmy(D.date)),
        h("div",null,h("span",{class:"chip"},pick(LB.set).map(x=>x[1]).join(" · "))))

  P.append(h("div",{class:"title"},

      kv("address",val(c.addr))
    ),
    h("div",{class:"box"},
      kv("orderNo",D.orderNo),
      kv("term",val(D.term)),
      kv("due",dmy(D.due)),
      kv("sales",h("span",{class:"val"},val(D.sales.name,"unsure"),unsureTag(),val(D.sales.area),h("span",{class:"mono"},D.sales.ref)))
    )
  ));

  const th = key => h("th",{class:["qty","price","amount"].includes(key)?"num":""},lab(key));
  const tbody=h("tbody");
  D.items.forEach((it,i)=>tbody.append(h("tr",null,
    h("td",{class:"mono"},String(i+1)), h("td",{class:"mono"},it.code), h("td",null,val(it.desc)),
    h("td",{class:"mono"},it.wh), h("td",{class:"num"},fmt(it.qty)), h("td",null,val(it.unit)),
    h("td",{class:"num"},fmt(it.price)), h("td",{class:"num"},fmt(it.amount)))));
  tbody.append(h("tr",null,h("td",{class:"filler",colspan:"8"})));
  P.append(h("div",{class:"tablewrap"},h("table",null,
    h("thead",null,h("tr",null,th("no"),th("code"),th("desc"),th("wh"),th("qty"),th("unit"),th("price"),th("amount"))),tbody)));

  const step=(key,v,cls)=>h("div",{class:"step"+(cls?" "+cls:"")},lab(key),h("span",{class:"num"},fmt(v)));
  P.append(h("div",{class:"bottom"},
    h("div",{style:"display:grid;gap:10px"},
      h("div",{class:"box"},
        kv("delivery",h("span",{class:"val"},val(D.delivery.note),val(D.delivery.place),
          h("span",{class:"l"},h("span",{class:"mono"},D.delivery.contact)," · ",pick(D.delivery.person).map(x=>x[1]).join(" / "))))),
      h("div",{class:"box terms"},lab("terms"),
        h("ul",null,...D.terms.map(tr=>h("li",null,val(tr)))))
    ),
    h("div",{class:"ladder"},
      step("total",t.total), step("discount",t.discount,"sub"), step("afterDisc",t.afterDisc),
      step("deposit",t.deposit,"sub"), step("afterDep",t.afterDep),
      step("exempt",t.exempt,"sub"), step("taxable",t.taxable), step("vat",t.vat),
      step("net",t.net,"net"))
  ));
  P.append(h("div",{class:"words"},val(D.words)));

  const sg=(key,state)=>h("div",{class:"sign"},lab(key),h("span",{class:"state"},state));
  const signedTxt=pick(LB.signed).map(x=>x[1]).join(" · ");
  P.append(h("div",{class:"signs"},
    sg("receiver","✓ "+signedTxt), sg("issuer","✓ "+signedTxt),
    sg("deliverer",h("span",null,"✓ ",pick(D.signs.deliverer).map(x=>x[1]).join(" / ")))));

  P.append(h("div",{class:"foot"},
    h("span",null,pick(LB.since).map(x=>x[1]).join(" / ")+" "+D.formSince),
    h("span",null,pick(LB.forCust).map(x=>x[1]).join(" / ")),
    h("span",{class:"mono"},D.formCode)));
}

/* ---------- automatic checks (computed, not typed) ---------- */
function renderChecks(){
  const t=D.totals, R=[];
  const add=(ok,title,detail)=>R.push({ok,title,detail});
  add(taxIdOk(D.seller.taxId),"판매자 세금번호 13자리",`${D.seller.taxId} · 마지막 숫자 검사 ${taxIdOk(D.seller.taxId)?"통과":"실패"}`);
  add(taxIdOk(D.customer.taxId),"구매자(우리 회사) 세금번호",`${D.customer.taxId} · 본사 표시 있음. 정식 세금계산서 조건 충족`);
  const itemsSum=D.items.reduce((a,i)=>a+i.amount,0), lineOk=D.items.every(i=>Math.abs(i.qty*i.price-i.amount)<0.01);
  add(lineOk && Math.abs(itemsSum-t.total)<0.01,"품목 금액 = 수량 × 단가, 합계 일치",`${D.items.map(i=>`${fmt(i.qty)} × ${fmt(i.price)} = ${fmt(i.amount)}`).join(", ")}`);
  const chain = Math.abs(t.total-t.discount-t.afterDisc)<0.01 && Math.abs(t.afterDisc-t.deposit-t.afterDep)<0.01 && Math.abs(t.exempt+t.taxable-t.afterDep)<0.01;
  add(chain,"할인 · 계약금 · 면세 계산 흐름",`${fmt(t.total)} − ${fmt(t.discount)} − ${fmt(t.deposit)} = ${fmt(t.afterDep)}`);
  const vatCalc=Math.round(t.taxable*7)/100;
  add(Math.abs(vatCalc-t.vat)<=1,"부가세 7%",`${fmt(t.taxable)} × 7% = ${fmt(vatCalc)} · 적힌 값 ${fmt(t.vat)}`);
  add(Math.abs(t.taxable+t.exempt+t.vat-t.net)<0.01,"최종 합계",`${fmt(t.taxable)} + ${fmt(t.vat)} = ${fmt(t.net)}`);
  const w=bahtText(t.net);
  add(w===D.wordsPrinted.replace(/\s|\(|\)/g,""),"태국어 금액 글자 = 숫자 합계",`계산: ${w}`);
  const dd=new Date(D.date+"T00:00:00Z"); dd.setUTCDate(dd.getUTCDate()+D.creditDays);
  add(dd.toISOString().slice(0,10)===D.due,"지급 기한 = 날짜 + 외상 15일",`${dmy(D.date)} + ${D.creditDays}일 = ${dmy(dd.toISOString().slice(0,10))}`);
  add(true,"문서번호 속 불교력 연도",`${D.docNo} 의 "69"는 불교력 2569년 = 서기 2026년. 날짜는 이미 서기로 적혀 있어요`);
  add(false,"사람이 확인해 주세요",`구매자 회사 이름과 영업 담당자 이름은 사진에서 흐리게 보여요. 점선 밑줄 표시한 곳을 원본과 비교해 주세요`);

  const C=document.getElementById("checks"); C.replaceChildren(
    h("h2",null,`자동 확인 결과 · ${R.filter(r=>r.ok).length}/${R.length} 통과`),
    h("ul",{class:"clist"},...R.map(r=>h("li",null,h("span",{class:"mark "+(r.ok?"ok":"warn"),"aria-label":r.ok?"통과":"확인 필요"},r.ok?"✓":"!"),
      h("span",null,r.title,h("small",null,r.detail))))));
}

/* ---------- language switch ---------- */
function renderLangs(){
  const box=document.getElementById("langs"); box.replaceChildren();
  for(const [k,n] of [["all","3개 언어"],["th","ไทย"],["en","English"],["ja","日本語"]])
    box.append(h("button",{type:"button","aria-pressed":String(mode===k),lang:k==="all"?"ko":k,onclick:()=>{mode=k;renderLangs();render();}},n));
}
renderLangs(); render(); renderChecks();
</script>
