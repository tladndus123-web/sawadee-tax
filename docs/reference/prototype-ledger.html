<title>태국 영수증 장부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+JP:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#e9efed; --band:#e3efe8; --line:#d3ddd9; --rule:#b9c9c2; --rule-2:#dfe8e4;
  --ink:#16231f; --ink-2:#4d5f59; --ink-3:#7c8c86;
  --accent:#0d6e53; --accent-ink:#ffffff; --accent-soft:#d6ece4;
  --warn:#9a5b00; --warn-soft:#fbecd2; --bad:#b0281c; --bad-soft:#fadcd8; --ok:#1c7a43; --ok-soft:#dcefe2;
  --stamp:#b0281c; --radius:10px;
  --sans:"IBM Plex Sans KR","IBM Plex Sans Thai","IBM Plex Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0f1513; --surface:#171f1c; --surface-2:#1f2926; --band:#1c2a25; --line:#2d3a36; --rule:#34443e; --rule-2:#26332e;
    --ink:#e4ece9; --ink-2:#a9b8b3; --ink-3:#7a8a85;
    --accent:#3cbf93; --accent-ink:#06140f; --accent-soft:#173a2f;
    --warn:#f0b454; --warn-soft:#3a2a10; --bad:#f07a6e; --bad-soft:#3d1a16; --ok:#5ccf8a; --ok-soft:#173424; --stamp:#f07a6e;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0f1513; --surface:#171f1c; --surface-2:#1f2926; --band:#1c2a25; --line:#2d3a36; --rule:#34443e; --rule-2:#26332e;
  --ink:#e4ece9; --ink-2:#a9b8b3; --ink-3:#7a8a85;
  --accent:#3cbf93; --accent-ink:#06140f; --accent-soft:#173a2f;
  --warn:#f0b454; --warn-soft:#3a2a10; --bad:#f07a6e; --bad-soft:#3d1a16; --ok:#5ccf8a; --ok-soft:#173424; --stamp:#f07a6e;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:20px}
[lang="th"]{font-family:"IBM Plex Sans Thai",var(--sans);line-height:1.7}
[lang="ja"]{font-family:"IBM Plex Sans JP",var(--sans)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{margin:0;text-wrap:balance;line-height:1.25}
h2{font-size:17px;font-weight:600}
.muted{color:var(--ink-2)} .small{font-size:13px}
.label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:20px 4px;max-width:1280px;margin:0 auto}
.brand{display:flex;gap:12px;align-items:center}
.seal{width:40px;height:40px;border-radius:50%;border:2px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-weight:600;font-size:16px;transform:rotate(-8deg);flex:none}
.brand h1{font-size:20px;font-weight:600}
.brand p{margin:0;font-size:13px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:4px 11px;border-radius:999px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;display:grid;gap:2px;align-content:start}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v.warn{color:var(--warn)} .stat .v.acc{color:var(--accent)} .stat .v.bad{color:var(--bad)}
@media (max-width:760px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

.drop{border:2px dashed var(--line);border-radius:var(--radius);background:var(--surface);padding:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .icon{width:52px;height:52px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.drop .txt{flex:1 1 240px;display:grid;gap:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.notice{border-radius:8px;padding:10px 14px;font-size:14px;background:var(--warn-soft);color:var(--warn);margin-top:10px}
.notice.bad{background:var(--bad-soft);color:var(--bad)} .notice.ok{background:var(--accent-soft);color:var(--accent)}
.busy{display:flex;gap:12px;align-items:center}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* review shell */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr)}
.panel .photo{border-right:1px solid var(--line);padding:16px;background:var(--surface-2);border-radius:var(--radius) 0 0 var(--radius)}
.panel .photo img{width:100%;border-radius:6px;display:block;position:sticky;top:16px}
.panel .photo .none{aspect-ratio:3/4;display:grid;place-items:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:6px}
.panel .main{padding:18px 20px;display:grid;gap:14px;min-width:0}
@media (max-width:900px){.panel{grid-template-columns:1fr}.panel .photo{border-right:0;border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0}.panel .photo img{max-height:360px;object-fit:contain;position:static}}
.rhead{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.rtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--band);color:var(--ink-2);white-space:nowrap;vertical-align:1px}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.full{background:var(--accent-soft);color:var(--accent)}

/* invoice paper */
.paper{border:1px solid var(--rule);border-radius:4px;padding:18px;display:grid;gap:12px;background:var(--surface)}
.top{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.seller .name{font-size:17px;font-weight:600}
.addr{color:var(--ink-2);font-size:12.5px}
.docbox{border:1px solid var(--rule);display:grid}
.docbox .serial{font-family:var(--mono);color:var(--accent);font-size:19px;font-weight:600;text-align:right;padding:6px 10px;border-bottom:1px solid var(--rule)}
.docbox .in{padding:8px 10px;display:grid;gap:6px}
.title{text-align:center;display:grid;gap:2px}
.title .orig{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:600}
.title .main{font-size:18px;font-weight:600}
.title .sub{color:var(--ink-2)}
.boxes{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px}
.box{border:1px solid var(--rule);padding:10px 12px;display:grid;gap:6px;min-width:0;align-content:start}
.kv{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:4px 12px;align-items:baseline}
.kv + .kv{border-top:1px dashed var(--rule-2);padding-top:6px}
.lab{font-size:11.5px;color:var(--ink-3);display:grid;line-height:1.35}
.val{min-width:0;overflow-wrap:anywhere}
.val .l{display:block}
.val .l + .l{color:var(--ink-2);font-size:13px}
.unsure .l:first-child,.unsure.l{text-decoration:underline dotted var(--warn);text-underline-offset:3px}
.tablewrap{overflow-x:auto;border:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;min-width:680px}
th{background:var(--band);font-weight:600;font-size:12px;text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:bottom}
th .lab{color:var(--ink-2)}
td{padding:8px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px;align-items:start}
.ladder{border:1px solid var(--rule);display:grid}
.step{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:10px;padding:6px 12px;border-bottom:1px solid var(--rule-2);align-items:center}
.step.sub .lab{padding-left:10px}
.step.net{background:var(--band);border-bottom:0;padding-block:10px}
.step.net .num,.step.net input{font-size:16px;font-weight:600;color:var(--accent)}
.step.wht{border-top:1px solid var(--rule);background:transparent}
.words{background:var(--band);border:1px solid var(--rule);padding:10px 12px;text-align:center;font-weight:600}
.words .l + .l{font-weight:400;color:var(--ink-2);font-size:13px}
.terms{font-size:12.5px;color:var(--ink-2)}
.terms ul{margin:4px 0 0;padding-left:18px;display:grid;gap:3px}
.signs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sign{border:1px solid var(--rule);padding:10px 12px;display:grid;gap:6px}
.pfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}
@media (max-width:760px){.paper{padding:12px}.top,.boxes,.bottom,.signs{grid-template-columns:1fr}.kv{grid-template-columns:1fr}}

/* edit inputs */
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;min-width:0}
input.num{text-align:right}
.tri-in{display:grid;gap:4px}
.tri-in .r{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;align-items:center}
.tri-in .r > span{font-size:10.5px;font-weight:600;color:var(--ink-3);letter-spacing:.04em}
.inline{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
td .x{border:1px solid var(--line);background:transparent;border-radius:6px;width:30px;height:30px;color:var(--ink-3)}
td .x:hover{color:var(--bad);border-color:var(--bad)}
.check{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.check input{width:auto}

/* checks */
.checks{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:10px}
.checks h3{margin:0;font-size:14.5px;font-weight:600}
.clist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 20px;margin:0;padding:0;list-style:none}
.clist li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;font-size:13.5px}
.mark{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;margin-top:1px}
.mark.ok{background:var(--ok-soft);color:var(--ok)} .mark.warn{background:var(--warn-soft);color:var(--warn)}
.clist small{display:block;color:var(--ink-3);font-size:12px;overflow-wrap:anywhere}
@media (max-width:760px){.clist{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.actions .grow{flex:1}
.paidbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.paidbox input[type=date]{width:auto}

/* ledger */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.lhead{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.lhead .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lhead select{width:auto}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 170px 150px 130px 18px;gap:12px;align-items:center;padding:11px 16px;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.head{font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.05em;text-transform:uppercase;cursor:default}
.row.head:hover{background:transparent}
.row .vendor{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .vendor small{display:block;color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.row .amt{text-align:right}
.dot{display:block;width:9px;height:9px;border-radius:50%;background:var(--warn)}
@media (max-width:760px){
  .row{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
  .row.head{display:none}
  .row .date{grid-column:1;order:2;font-size:12.5px;color:var(--ink-3)}
  .row .vendor{grid-column:1;order:1}
  .row .amt{grid-column:2;grid-row:1}
  .row .c3,.row .c4{order:3;grid-column:1 / -1}
  .row .c3{display:none}
  .row .flag{grid-column:2;grid-row:2;justify-self:end}
}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.cats{display:grid;gap:8px;padding:14px 16px;border-top:1px solid var(--line)}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.settings{padding:12px 16px;border-top:1px solid var(--line);font-size:13px}
.settings summary{cursor:pointer;color:var(--ink-2)}
.settings .srow{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px}
.settings label{display:grid;gap:3px}
.settings input{width:220px}
footer{max-width:1280px;margin:0 auto;font-size:12.5px;color:var(--ink-3)}
</style>

  <div class="brand">

<div class="wrap">

<footer id="foot"></footer>

function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){ if(v==null||v===false) continue;
    if(k==="class") el.className=v; else if(k==="value") el.value=v; else if(k==="checked") el.checked=!!v;
    else if(k.startsWith("on")&&typeof v==="function") el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?"":v); }
  for(const c of kids.flat()){ if(c==null||c===false) continue; el.append(c instanceof Node?c:String(c)); }
  return el;
}
const fmt=n=>(Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

/* ======================= Thai rules ======================= */
function taxIdOk(id){ const d=(id||"").replace(/\D/g,""); if(d.length!==13) return false; let s=0; for(let i=0;i<12;i++) s+=+d[i]*(13-i); return (11-s%11)%10===+d[12]; }
function thaiInt(n){
  const D=["","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า"],P=["","สิบ","ร้อย","พัน","หมื่น","แสน"];
  let s=String(n).replace(/^0+/,""); if(!s) return "";
  const g=[]; while(s.length>6){ g.unshift(s.slice(-6)); s=s.slice(0,-6); } g.unshift(s);
  let out="";
  g.forEach((grp,gi)=>{ const gs=grp.replace(/^0+/,""); const higher=out!=="";
    for(let i=0;i<gs.length;i++){ const x=+gs[i],pos=gs.length-1-i; if(!x) continue;
      if(pos===1) out+=x===1?"สิบ":x===2?"ยี่สิบ":D[x]+"สิบ";
      else if(pos===0&&x===1&&(gs.length>1||higher)) out+="เอ็ด";
      else out+=D[x]+P[pos]; }
    if(gi<g.length-1) out+="ล้าน"; });
  return out;
}
function bahtText(v){ const st=Math.round((+v||0)*100),b=Math.floor(st/100),s=st%100; if(!b&&!s) return "ศูนย์บาทถ้วน"; return (b?thaiInt(b)+"บาท":"")+(s?thaiInt(s)+"สตางค์":"ถ้วน"); }
function addDays(iso,n){ const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }

/* All checks. Each: {key, ok, na, detail}. na = not applicable (hidden from flags). */
function runChecks(r){
  const d=T[state.ui].d, C=[]; const tt=r.totals||{};
  const add=(key,ok,detail,na)=>C.push({key,ok:!!ok,na:!!na,detail});
  const needTax=r.docType==="full"||r.docType==="abbr";
  const sTax=(r.seller?.taxId||"").replace(/\D/g,"");
  if(!sTax) add("sellerTax",!needTax,d.missing,!needTax);
  else add("sellerTax",taxIdOk(sTax),`${sTax} · ${taxIdOk(sTax)?d.valid:d.invalid}`);
  const bTax=(r.customer?.taxId||"").replace(/\D/g,"");
  if(r.docType==="full"){
    if(!bTax) add("buyerTax",false,d.missing);
    else add("buyerTax",taxIdOk(bTax),`${bTax} · ${taxIdOk(bTax)?d.valid:d.invalid}`);
  } else if(bTax) add("buyerTax",taxIdOk(bTax),`${bTax} · ${taxIdOk(bTax)?d.valid:d.invalid}`);
  const co=(state.company.taxId||"").replace(/\D/g,"");
  if(bTax){ if(!co) add("company",true,d.noCompany,true); else add("company",co===bTax,co===bTax?d.same:d.differ); }
  const items=r.items||[];
  if(items.length){
    const lineBad=items.filter(i=>i.price && !near(i.qty*i.price,i.amount,0.5));
    const sum=items.reduce((a,i)=>a+(+i.amount||0),0);
    const ok=!lineBad.length && (!tt.total || near(sum,tt.total,1));
    add("items",ok,`${items.map(i=>i.price?`${fmt(i.qty)} × ${fmt(i.price)} = ${fmt(i.amount)}`:fmt(i.amount)).slice(0,3).join(", ")} · Σ ${fmt(sum)} / ${fmt(tt.total)}`);
  }
  if(tt.total){
    const ok=near(tt.total-tt.discount,tt.afterDisc,1)&&near(tt.afterDisc-tt.deposit,tt.afterDep,1)&&near(tt.exempt+tt.taxable,tt.afterDep,1);
    add("chain",ok,`${fmt(tt.total)} − ${fmt(tt.discount)} − ${fmt(tt.deposit)} = ${fmt(tt.afterDep)} (${fmt(tt.exempt)} + ${fmt(tt.taxable)})`);
  }
  if(tt.vat||tt.taxable){ const calc=Math.round(tt.taxable*7)/100; add("vat",Math.abs(calc-tt.vat)<=Math.max(1,tt.taxable*0.002),`${fmt(tt.taxable)} × 7% = ${fmt(calc)} · ${d.written} ${fmt(tt.vat)}`); }
  if(tt.net){ const calc=tt.taxable+tt.exempt+tt.vat; add("net",near(calc,tt.net,1),`${fmt(tt.taxable)} + ${fmt(tt.exempt)} + ${fmt(tt.vat)} = ${fmt(calc)} · ${d.written} ${fmt(tt.net)}`); }
  if(r.wordsPrinted){ const w=bahtText(tt.net); add("words",w===r.wordsPrinted.replace(/[\s()（）]/g,""),`${d.calc}: ${w}`); }
  if(r.creditDays && isoOk(r.date) && isoOk(r.dueDate)){ const c=addDays(r.date,r.creditDays); add("due",c===r.dueDate,`${dmy(r.date)} + ${r.creditDays} = ${dmy(c)} · ${d.written} ${dmy(r.dueDate)}`); }
  add("date",isoOk(r.date),isoOk(r.date)?`${dmy(r.date)} · ${r.dateWasBuddhist?d.be:d.gregorian}`:d.missing);
  const un=r.unclear||[]; add("unclear",!un.length,un.length?`${un.length} · ${d.checkPhoto}`:d.noneUnclear);
  if(r.docNo && sTax){ const dup=state.receipts.some(x=>x.id!==r.id && x.docNo===r.docNo && (x.seller?.taxId||"")===sTax); add("dup",!dup,dup?d.dupFound:d.noDup); }
  add("conf",r.confidence!=="low",r.confidence==="low"?d.low:d.ok);
  return C;
}
const flagsFor=r=>runChecks(r).filter(c=>!c.ok&&!c.na).map(c=>c.key);
const claimable=r=>r.docType==="full" && taxIdOk(r.customer?.taxId) && (!state.company.taxId || state.company.taxId.replace(/\D/g,"")===(r.customer?.taxId||"").replace(/\D/g,""));

/* Accepts AI output, stored docs, or first-version docs and returns the full shape. */
function normalize(a){
  const b=blank(); if(!a||typeof a!=="object") return b;
  if(a.vendor && !a.seller){ // first-version document
    a={...a,seller:{name:a.vendor,taxId:a.taxId,branchCode:a.branch},
      items:(a.items||[]).map(i=>({desc:i.name,qty:i.qty,amount:i.amount})),
      totals:{total:a.subtotal,afterDisc:a.subtotal,afterDep:a.subtotal,taxable:a.subtotal,vat:a.vat,net:a.total,wht:a.wht}};
  }
  let date=str(a.date), be=!!a.dateWasBuddhist;
  const fixDate=s=>{ const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(str(s)); if(!m) return ["",false]; let y=+m[1],w=false; if(y>2400){y-=543;w=true;} return [`${y}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`,w]; };
  let w; [date,w]=fixDate(date); be=be||w; const [due]=fixDate(a.dueDate);
  const s=a.seller||{}, c=a.customer||{}, sl=a.sales||{}, dv=a.delivery||{}, tt=a.totals||{}, sg=a.signs||{};
  const T0={total:numOrNull(tt.total),discount:numv(tt.discount),deposit:numv(tt.deposit),exempt:numv(tt.exempt),vat:numv(tt.vat),wht:numv(tt.wht)};
  T0.total=T0.total??numv(tt.net);
  T0.afterDisc=numOrNull(tt.afterDisc)??Math.round((T0.total-T0.discount)*100)/100;
  T0.afterDep=numOrNull(tt.afterDep)??Math.round((T0.afterDisc-T0.deposit)*100)/100;
  T0.taxable=numOrNull(tt.taxable)??Math.round((T0.afterDep-T0.exempt)*100)/100;
  T0.net=numOrNull(tt.net)??Math.round((T0.taxable+T0.exempt+T0.vat)*100)/100;
  return {...b,
    docType:DOC[a.docType]?a.docType:"other", docTitle:tri(a.docTitle), copyKind:COPY[a.copyKind]?a.copyKind:"unknown",
    formSerial:str(a.formSerial), docNo:str(a.docNo), date, dateWasBuddhist:be,
    seller:{name:tri(s.name),taxId:str(s.taxId).replace(/\D/g,"").slice(0,13),branchCode:str(s.branchCode),address:tri(s.address),tel:str(s.tel),fax:str(s.fax),saleOffice:str(s.saleOffice)},
    customer:{code:str(c.code),name:tri(c.name),taxId:str(c.taxId).replace(/\D/g,"").slice(0,13),branch:tri(c.branch),address:tri(c.address)},
    orderNo:str(a.orderNo), term:tri(a.term), creditDays:Math.max(0,Math.round(numv(a.creditDays))), dueDate:due,
    sales:{name:tri(sl.name),area:tri(sl.area),ref:str(sl.ref)},
    items:(Array.isArray(a.items)?a.items:[]).slice(0,40).map(i=>({code:str(i?.code),desc:tri(i?.desc),wh:str(i?.wh),qty:numv(i?.qty)||1,unit:tri(i?.unit),price:numv(i?.price),amount:numv(i?.amount)})),
    delivery:{note:tri(dv.note),place:tri(dv.place),contact:str(dv.contact),person:tri(dv.person)},
    totals:T0, wordsPrinted:str(a.wordsPrinted), words:tri(a.words),
    terms:(Array.isArray(a.terms)?a.terms:[]).slice(0,10).map(tri),
    signs:{receiver:!!sg.receiver,issuer:!!sg.issuer,deliverer:sg.deliverer?tri(sg.deliverer):null},
    formCode:str(a.formCode), formSince:str(a.formSince),
    category:CAT[a.category]?a.category:"other", payment:PAY[a.payment]?a.payment:"other",
    paid:!!a.paid, paidDate:isoOk(a.paidDate)?a.paidDate:"",
    confidence:["high","medium","low"].includes(a.confidence)?a.confidence:"medium",
    unclear:Array.isArray(a.unclear)?a.unclear.map(str).filter(Boolean).slice(0,30):[],

/* ======================= AI reading ======================= */
const PROMPT = `You are a bookkeeping assistant for a company in Thailand. The attached image is a photo of a purchase document: usually a Thai tax invoice / delivery note / debit note (ใบกำกับภาษี/ใบส่งของ/ใบแจ้งหนี้), an abbreviated tax invoice, or a receipt. Text may be Thai, English, Japanese or mixed. Our company is normally the CUSTOMER (buyer) on the document.

Read every printed and handwritten field and reply with ONLY one JSON object, no prose. Every object written as {"th","en","ja"} must contain the same content in Thai, English and Japanese.
{
 "notDocument": false,
 "docType": "full" | "abbr" | "receipt" | "other",
 "docTitle": {"th":"","en":"","ja":""},
 "copyKind": "original" | "copy" | "unknown",
 "formSerial": "pre-printed serial number of the paper form, e.g. 548139",
 "docNo": "document / invoice number exactly as printed",
 "date": "YYYY-MM-DD",
 "dateWasBuddhist": false,
 "seller": {"name":{"th":"","en":"","ja":""}, "taxId":"13 digits", "branchCode":"", "address":{"th":"","en":"","ja":""}, "tel":"", "fax":"", "saleOffice":"sales office phone/fax line as printed"},
 "customer": {"code":"customer code", "name":{"th":"","en":"","ja":""}, "taxId":"13 digits", "branch":{"th":"สำนักงานใหญ่","en":"Head office","ja":"本社"}, "address":{"th":"","en":"","ja":""}},
 "orderNo": "",
 "term": {"th":"เครดิต 15 วัน","en":"Credit 15 days","ja":"掛け 15日"},
 "creditDays": 0,
 "dueDate": "YYYY-MM-DD or empty",
 "sales": {"name":{"th":"","en":"","ja":""}, "area":{"th":"","en":"","ja":""}, "ref":"sales order / reference number"},
 "items": [{"code":"", "desc":{"th":"","en":"","ja":""}, "wh":"warehouse", "qty":0, "unit":{"th":"","en":"","ja":""}, "price":0, "amount":0}],
 "delivery": {"note":{"th":"","en":"","ja":""}, "place":{"th":"","en":"","ja":""}, "contact":"phone", "person":{"th":"","en":"","ja":""}},
 "totals": {"total":0, "discount":0, "afterDisc":0, "deposit":0, "afterDep":0, "exempt":0, "taxable":0, "vat":0, "net":0, "wht":0},
 "wordsPrinted": "the Thai amount-in-words exactly as printed, without brackets",
 "words": {"th":"","en":"","ja":""},
 "terms": [{"th":"","en":"","ja":""}],
 "signs": {"receiver": false, "issuer": false, "deliverer": {"th":"","en":"","ja":""} or null},
 "formCode": "e.g. FM-AC-12 Rev.:5", "formSince": "as printed",
 "category": "food" | "transport" | "fuel" | "office" | "supplies" | "utilities" | "rent" | "entertainment" | "other",
 "payment": "credit" | "cash" | "transfer" | "card" | "other",
 "confidence": "high" | "medium" | "low",
 "unclear": ["field paths you are unsure about, e.g. customer.name, sales.name, items.0.desc"],
 "note": {"th":"","en":"","ja":""}
}
Rules:
- docType: "full" = ใบกำกับภาษี / TAX INVOICE that shows the buyer's name, address and tax ID. "abbr" = ใบกำกับภาษีอย่างย่อ / ABB. "receipt" = plain receipt. Otherwise "other".
- Dates: output the Gregorian calendar. If a date uses the Buddhist Era (e.g. 2569 or 69), subtract 543 and set dateWasBuddhist true. Thai dates are day/month/year. Keep document numbers exactly as printed, even if they contain a Buddhist year such as "69".
- Company and person names: transliterate by sound (romaji-style English, katakana for Japanese); if an English name is printed on the document, use it for "en". Japanese addresses go in Japanese order starting with 〒postcode.
- Numbers: plain numbers, no commas. Read every totals line exactly as printed; do not recalculate. Use null for a totals line that is not printed on the document. wht only if printed.
- terms: the fine print at the bottom (payment conditions, claims, returns), one entry per sentence, max 6.
- signs: true when a signature or stamp is present in that box; give the deliverer's name if legible.
- Faint or handwritten text: give your best reading AND list its field path in "unclear".
- note: one short sentence about anything important that is missing or odd; empty strings if nothing.
- If the image is not a receipt or invoice, reply {"notDocument": true}.`;

async function prepImage(file){
  const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
  const max=2000,s=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",0.9));
}
async function readFile(file){
  if(!file||state.busy) return;
  state.msg=null; state.confirmDel=false;
  if(!state.sample){ toast("bad",t("noAi")); return; }
  if(!state.canImage){ toast("bad",t("noImage")); return; }
  let img; try{ img=await prepImage(file); }catch{ toast("bad",t("badImage")); return; }
  if(state.preview?.startsWith("blob:")) URL.revokeObjectURL(state.preview);
  state.draft=null; renderReview();
  state.busy=true; state.abort=new AbortController(); state.t0=Date.now(); renderUpload();
  const tick=setInterval(()=>{ const el=document.getElementById("secs"); if(el) el.textContent=Math.round((Date.now()-state.t0)/1000)+"s"; },1000);
  try{
    const a=await state.sample.json(PROMPT,{images:img,signal:state.abort.signal,modelTier:"complex"});
    if(!a||typeof a!=="object") throw {code:"parse"};
    if(a.notDocument||a.notReceipt){ toast("warn",t("notDoc")); return; }
    state.draft={...normalize(a),_file:img}; state.mode="view";
    state.preview=URL.createObjectURL(img);
    renderReview(); document.getElementById("review").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){
    const c=e?.code;
    if(c==="cancelled") state.msg=null;
    else if(c==="not_granted"||c==="unavailable") toast("bad",t("noAi"));
    else if(c==="rate_limited") toast("warn",t("rateLimited"));
    else if(c==="image_rejected") toast("bad",t("badImage"));
    else toast("bad",t("aiFail"));
  }finally{ clearInterval(tick); state.busy=false; state.abort=null; renderUpload(); }
}
function toast(kind,text){ state.msg={kind,text}; renderUpload(); }

async function saveDraft(){
  const d=state.draft; if(!d||state.saving) return;
  if(!state.db){ toast("bad",t("noDb")); return; }
  state.saving=true; renderReview();
  const n=normalize(JSON.parse(JSON.stringify({...d,_file:undefined})));
  const {id,...rest}=n;
  const body={...rest,createdAt:d.createdAt||Date.now(),updatedAt:Date.now(),uploaderId:d.uploaderId??state.myId??null,photo:d.photo||null,isSample:!!d.isSample};
  body.items=body.items.filter(i=>i.code||i.desc.th||i.desc.en||i.desc.ja||i.amount);
  body.flags=flagsFor({...body,id:d.id});
  let photoWarn=false;
  if(d._file&&!body.photo){
    if(state.assets){ try{ const up=await state.assets.upload(d._file,{type:"image/jpeg"}); body.photo=up.id; }catch{ photoWarn=true; } }
    else photoWarn=true;
  }
  try{
    const col=state.db.collection("receipts");
    await (d.id?col.doc(d.id):col.doc()).set(JSON.parse(JSON.stringify(body)));
    state.draft=null; state.saving=false; renderReview();
    toast(photoWarn?"warn":"ok",photoWarn?t("photoNotSaved"):t("saved"));
  }catch(e){
    state.saving=false; renderReview();
    toast("bad",e?.code==="invalid_argument"?t("notGranted"):e?.code==="quota_exceeded"?e.message:t("saveFail"));
  }
}
async function deleteDraft(){
  const d=state.draft; if(!d?.id||!state.db) return;
  try{ await state.db.collection("receipts").doc(d.id).delete(); state.draft=null; state.confirmDel=false; renderReview(); toast("ok",t("deleted")); }
  catch(e){ toast("bad",e?.code==="invalid_argument"?t("notGranted"):t("saveFail")); }
}
function openReceipt(r){
  state.msg=null; state.confirmDel=false; state.mode="view";
  if(state.preview?.startsWith("blob:")) URL.revokeObjectURL(state.preview);
  state.draft=normalize(JSON.parse(JSON.stringify(r)));
  state.preview=r.photo?"/_blob/"+r.photo:null;
  renderUpload(); renderReview();
  document.getElementById("review").scrollIntoView({behavior:"smooth",block:"start"});
}

/* ======================= CSV ======================= */
async function exportCsv(){
  const rows=filtered();
  const cols=["date","doc_no","doc_type","seller_th","seller_en","seller_ja","seller_tax_id","customer_th","customer_en","customer_tax_id","credit_days","due_date","paid","paid_date","category_en","category_th","category_ja",
    "items_th","items_en","items_ja","total","discount","deposit","exempt","taxable","vat_7","net","withholding","amount_words_th","checks_failed"];
  const q=v=>{ const s=String(v??""); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const lines=[cols.join(",")];
  for(const raw of rows){ const r=normalize(raw), tt=r.totals;
    const it=k=>r.items.map(i=>`${i.code?i.code+" ":""}${i.desc[k]} x${i.qty} ${fmt(i.amount)}`).join(" | ");
    lines.push([r.date,r.docNo,DOC[r.docType].en,r.seller.name.th,r.seller.name.en,r.seller.name.ja,r.seller.taxId,r.customer.name.th,r.customer.name.en,r.customer.taxId,
      r.creditDays||"",r.dueDate,r.paid?"yes":"no",r.paidDate,CAT[r.category].en,CAT[r.category].th,CAT[r.category].ja,it("th"),it("en"),it("ja"),
      ...["total","discount","deposit","exempt","taxable","vat","net","wht"].map(k=>(+tt[k]||0).toFixed(2)),
      r.wordsPrinted,flagsFor(raw).map(f=>T.en.c[f]).join("; ")].map(q).join(","));
  }
  if(!state.downloads){ toast("bad",t("exportFail")); return; }
  try{ await state.downloads.save({filename:"ledger_"+(state.month==="all"?"all":state.month)+".csv",data:"﻿"+lines.join("\r\n")}); }
  catch(e){ if(!["cancelled","declined","dismissed"].includes(e?.code)) toast("bad",t("exportFail")); }
}

    h("button",{class:"btn",type:"button",onclick:()=>{state.draft=null;state.confirmDel=false;renderReview();}},t("close")),
    h("span",{class:"grow"}));
  if(d.id){
    if(state.confirmDel) actions.append(h("span",{class:"small"},t("confirmDel")),
      h("button",{class:"btn danger solid",type:"button",onclick:deleteDraft},t("yesDel")),
      h("button",{class:"btn",type:"button",onclick:()=>{state.confirmDel=false;renderReview();}},t("no")));
    else actions.append(h("button",{class:"btn danger",type:"button",onclick:()=>{state.confirmDel=true;renderReview();}},t("del")));
  }
  el.append(h("div",{class:"panel"},photo,h("div",{class:"main"},head,meta,
    state.mode==="edit"?invoiceEdit(d):invoiceView(d), checksPanel(d), actions)));
}

/* ======================= render: ledger ======================= */
function dueChip(r){
  if(r.paid) return h("span",{class:"chip ok"},t("paid")+(r.paidDate?" · "+dmy(r.paidDate):""));
  if(r.payment!=="credit"&&!r.dueDate) return h("span",{class:"chip"},L(PAY[r.payment]));
  if(r.dueDate&&r.dueDate<today()) return h("span",{class:"chip bad"},`${t("overdue")} · ${dmy(r.dueDate)}`);
  return h("span",{class:"chip warn"},`${t("unpaid")}${r.dueDate?" · "+t("dueOn")+" "+dmy(r.dueDate):""}`);
}
function renderLedger(){
  const el=document.getElementById("ledger"); el.replaceChildren();
  const ms=months(); if(state.month!=="all"&&!ms.includes(state.month)) state.month="all";
  const mSel=h("select",{id:"f-month","aria-label":"month",onchange:e=>{state.month=e.target.value;renderSummary();renderLedger();}},
    h("option",{value:"all",selected:state.month==="all"},t("allTime")),...ms.map(m=>h("option",{value:m,selected:m===state.month},m)));
  const vSeg=h("div",{class:"seg",role:"group","aria-label":t("show")},...LANGS.map(([lg,n])=>h("button",{type:"button",lang:lg,"aria-pressed":String(state.view===lg),onclick:()=>{state.view=lg;safeSet("view",lg);renderLedger();}},n)));
  el.append(h("div",{class:"lhead"},h("h2",null,t("ledger")),
    h("div",{class:"tools"},h("span",{class:"small muted"},t("show")),vSeg,mSel,
      h("button",{class:"btn",type:"button",disabled:!filtered().length||!state.downloads,onclick:exportCsv},t("export")))));
  if(!state.loaded&&state.db){ el.append(h("div",{class:"empty"},h("div",{class:"spin",style:"margin:0 auto"}))); }
  else{
    const raw=filtered().slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
    if(!raw.length) el.append(h("div",{class:"empty"},t("empty")));
    else{
      const v=state.view;
      el.append(h("div",{class:"row head"},h("span",null,t("colDate")),h("span",null,t("colVendor")),h("span",null,t("colType")),h("span",null,t("colDue")),h("span",{class:"amt"},t("colTotal")),h("span")));
      for(const x of raw){ const r=normalize(x), fl=flagsFor(x);
        el.append(h("button",{class:"row",type:"button",onclick:()=>openReceipt(x)},
          h("span",{class:"date mono small"},dmy(r.date)),
          h("span",{class:"vendor",lang:v},r.seller.name[v]||r.seller.name.en||r.seller.name.th||"—",r.isSample?h("span",{class:"chip",style:"margin-left:6px"},t("ex")):null,h("small",null,r.docNo||"")),
          h("span",{class:"c3"},h("span",{class:"chip"+(r.docType==="full"?" full":""),lang:v},DOC[r.docType][v])),
          h("span",{class:"c4"},dueChip(r)),
          h("span",{class:"amt mono"},baht(r.totals.net)),
          h("span",{class:"flag",title:fl.map(f=>T[state.ui].c[f]).join(", ")},fl.length?h("span",{class:"dot","aria-label":t("sCheck")}):null)));
      }
      const byCat={}; for(const x of raw){ const r=normalize(x); byCat[r.category]=(byCat[r.category]||0)+r.totals.net; }
      const entries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]); const max=entries[0]?.[1]||1;
      el.append(h("div",{class:"cats"},h("span",{class:"label"},t("byCat")),
        ...entries.map(([k,sum])=>h("div",{class:"bar"},h("span",{lang:v},CAT[k]?.[v]||k),h("div",{class:"track"},h("div",{class:"fill",style:`width:${Math.max(1,sum/max*100)}%`})),h("span",{class:"num"},baht(sum))))));
    }
  }
  // company settings
  const coIn=h("input",{id:"f-company",class:"mono",inputmode:"numeric",maxlength:"13",value:state.company.taxId||""});
  const msg=h("span",{class:"small muted"});
  el.append(h("details",{class:"settings"},h("summary",null,t("settings")),
    h("div",{class:"srow"},h("label",null,h("span",null,t("companyTax")),coIn),
      h("button",{class:"btn sm",type:"button",disabled:!state.db,onclick:async()=>{
        const v=coIn.value.replace(/\D/g,"").slice(0,13);
        try{ await state.db.doc("settings/company").set({taxId:v}); msg.textContent=t("companySaved"); }
        catch(e){ msg.textContent=e?.code==="invalid_argument"?t("notGranted"):t("saveFail"); } }},t("companySave")),msg)));
}

function renderAll(){ renderHeader(); renderSummary(); renderUpload(); renderReview(); renderLedger(); }
renderAll();

/* ======================= capabilities ======================= */
(async()=>{
  const use=n=>window.claude?.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const [db,sample,assets,downloads,user]=await Promise.all(["db","sample","assets","downloads","user"].map(use));
  Object.assign(state,{db,sample,assets,downloads,user});
  if(sample){ const lim=await sample.limits().catch(()=>null); state.canImage=!!lim?.images; }
  if(user){ try{ state.myId=await user.id(); }catch{} }
  state.capsReady=true;
  if(db){
    db.doc("settings/company").onSnapshot(s=>{ state.company={taxId:str(s.data()?.taxId)}; renderSummary(); renderLedger(); if(state.draft) redrawChecks(); },()=>{});
    db.collection("receipts").orderBy("date","desc").limit(1000).onSnapshot(async snap=>{
      state.receipts=snap.docs.map(s=>({id:s.id,...s.data()}));
      state.loaded=true; renderSummary(); renderLedger();
      if(user){ const ids=[...new Set(state.receipts.map(r=>r.uploaderId).filter(Boolean))];
        if(ids.length){ try{ const ps=await user.profiles(ids); for(const id of ids) state.names[id]=ps?.[id]?.name||""; }catch{} } }
    },()=>{ state.loaded=true; renderLedger(); });
  }
  renderUpload(); renderLedger();
})();
</script>
