# Deploy to production on every push to main (so a collaborator's push goes live without a Vercel seat or database
# access). Order: checks → database migrations (Supabase) → database rule tests → site (Vercel).
# - Vercel: the Hobby plan blocks Git deployments of a private repo pushed by anyone but the owner, so this runs the
#   owner's Vercel CLI with the owner's token (repository secret VERCEL_TOKEN, scope tladndus123-webs-projects).
# - Supabase: new files in supabase/migrations are applied to the cloud database first (the app reads new columns at
#   once), then the pgTAP rule tests run against it (inside a transaction that is rolled back). Repository secrets
#   SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD; the project comes from the site's own settings (vercel pull).
#   Without them, a push that adds migrations stops here; one that doesn't goes on (with a warning).
# Any failing step stops the deploy: the site stays as it was.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in push order
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_YG0av4A9YO9IrpCm78X4rMi9
      VERCEL_PROJECT_ID: prj_s727ekVoaFyUnAmnLPCIN2ZcdXRc
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the pushed commits are compared to see whether they add migrations
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Checks
        run: |
          npx tsc --noEmit
          npx eslint .
          npx vitest run

      - name: Deploy key present?
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::The repository secret VERCEL_TOKEN is missing (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Site settings
        run: npx --yes vercel@61 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Database
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- supabase/migrations | wc -l)
          else
            CHANGED=unknown
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            if [ "$CHANGED" = "0" ]; then
              echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD are not set: database step skipped (this push has no migrations)."
              exit 0
            fi
            echo "::error::This push may change the database, but SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD are missing (GitHub → Settings → Secrets and variables → Actions). Nothing was deployed."
            exit 1
          fi
          # The project: from the site's own Supabase address (https://<ref>.supabase.co)
          REF=$(grep -E '^NEXT_PUBLIC_SUPABASE_URL=' .vercel/.env.production.local | sed -E 's#.*https://([a-z0-9]+)\.supabase\.co.*#\1#')
          if ! echo "$REF" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "::error::Could not find the Supabase project in the site settings."
            exit 1
          fi
          npx supabase link --project-ref "$REF" --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run
          npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
          npx supabase test db --linked

      - name: Build and deploy
        run: |
          npx --yes vercel@61 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@61 deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tee deploy-url.txt

      - name: Live check
        run: |
          sleep 10
          curl -fsS https://thai-receipt-ledger.vercel.app/api/extract | grep -q '"slipPieces":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST https://thai-receipt-ledger.vercel.app/api/extract)" = "401"
          echo "Live: https://thai-receipt-ledger.vercel.app ($(tail -1 deploy-url.txt))"
