<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The AI assistant's mark (owner's pick "A", 2026-10-27): the app logo's family — same blue tile and yellow badge —
       with a talking face in a speech bubble and a sparkle instead of the check -->
  <defs>
    <radialGradient id="tile" cx="0.5" cy="0.34" r="0.78">
      <stop offset="0" stop-color="#2a86ff"/>
      <stop offset="0.45" stop-color="#0462e6"/>
      <stop offset="1" stop-color="#0536b8"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4edfc"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdda4d"/>
      <stop offset="1" stop-color="#f4a61e"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect width="64" height="64" rx="15" fill="url(#shine)"/>
  <g transform="translate(32 32) scale(1.1) translate(-32 -32)">
  <!-- speech bubble with a face -->
  <path d="M14.5 21.5a7 7 0 0 1 7-7h19a7 7 0 0 1 7 7v12a7 7 0 0 1-7 7H28l-6.5 5.6c-.9.8-2.3.1-2.3-1.1V40.3a7 7 0 0 1-4.7-6.6z" fill="#012a8c" opacity="0.35" transform="translate(0.6 1.4)"/>
  <path d="M14.5 21.5a7 7 0 0 1 7-7h19a7 7 0 0 1 7 7v12a7 7 0 0 1-7 7H28l-6.5 5.6c-.9.8-2.3.1-2.3-1.1V40.3a7 7 0 0 1-4.7-6.6z" fill="url(#paper)"/>
  <rect x="21.5" y="22.3" width="4.2" height="7.2" rx="2.1" fill="#0b4bbc"/>
  <rect x="31.8" y="22.3" width="4.2" height="7.2" rx="2.1" fill="#0b4bbc"/>
  <!-- yellow sparkle badge -->
  <circle cx="42.6" cy="44.2" r="10.4" fill="#0a2f8f" opacity="0.28" transform="translate(0.4 1.2)"/>
  <circle cx="42.6" cy="44.2" r="10.4" fill="url(#badge)"/>
  <path d="M34.6 41.6a8.6 8.6 0 0 1 15.4-3.5" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M42.6 37.6C43.4 41.6 44.6 42.9 48.6 44.2C44.6 45.5 43.4 46.8 42.6 50.8C41.8 46.8 40.6 45.5 36.6 44.2C40.6 42.9 41.8 41.6 42.6 37.6Z" fill="#fff"/>
  </g>
</svg>
